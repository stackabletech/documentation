[build]
  command = "make netlify-build"
  publish = "build/site"

[[redirects]]
  from = "/home/stable/reference/*"
  to = "https://hub.stackable.tech/crds"
  status = 301

# The internal module is deleted on main but still exists on the release
# branches; this blocks it for every published version without backports.
[[redirects]]
  from = "/home/:version/internal/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/home/stable/release_notes.html"
  to = "/home/stable/release-notes"
  status = 301

# The bundle file names are not content-hashed, so a stale asset can be
# served until max-age expires. One hour keeps that window small; with
# content-hashed file names this could be immutable.
[[headers]]
  for = "/_/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
