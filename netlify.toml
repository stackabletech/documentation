[build]
  command = "make netlify-build"
  publish = "build/site"

[[redirects]]
  from = "/home/stable/reference/*"
  to = "https://hub.stackable.tech/crds"
  status = 301

# The internal module is deleted on main but still exists on the release
# branches; this blocks it for every published version without backports.
[[redirects]]
  from = "/home/:version/internal/*"
  to = "/404"
  status = 404
  force = true

# The page was only ever the resource requests fragment, which now lives in a
# partial included by the resources page; every published version has it there.
[[redirects]]
  from = "/home/:version/concepts/stackable_resource_requests/*"
  to = "/home/:version/concepts/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/home/stable/release_notes.html"
  to = "/home/stable/release-notes"
  status = 301

# The css and js file names carry a content hash, so they can be cached
# forever; fonts and images keep stable names and get moderate lifetimes.
# The rules are deliberately non-overlapping: netlify applies every matching
# header rule, and overlapping rules would emit duplicate Cache-Control.
[[headers]]
  for = "/_/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_/font/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
